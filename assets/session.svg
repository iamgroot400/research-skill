<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustrative example of a research lab session">
  <rect width="900" height="470" rx="14" fill="#0b1020"/>
  <rect width="900" height="40" rx="14" fill="#1a2138"/>
  <rect y="26" width="900" height="14" fill="#1a2138"/>
  <circle cx="24" cy="20" r="6.5" fill="#ff5f56"/><circle cx="46" cy="20" r="6.5" fill="#ffbd2e"/><circle cx="68" cy="20" r="6.5" fill="#27c93f"/>
  <text x="450" y="25" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">example session (illustrative, not a recording)</text>
  <g font-family="Consolas, Menlo, monospace" font-size="15">
    <text x="28" y="76" fill="#7dd3fc">&gt; PI, daily briefing</text>
    <text x="28" y="108" fill="#e2e8f0">PI briefing · 2026-10-17 · mode: discovery</text>
    <text x="28" y="134" fill="#94a3b8">Where we are  H1 (SAE features transfer across layers) is untested.</text>
    <text x="28" y="158" fill="#fbbf24">Concerns      A2 "features are linear" supports the main claim, untested.</text>
    <text x="28" y="182" fill="#fbbf24">              E1 has no prediction written down.</text>
    <text x="28" y="206" fill="#4ade80">Top 3         1. grad-student: write prediction for E1</text>
    <text x="28" y="230" fill="#4ade80">              2. intern: check split for leakage</text>
    <text x="28" y="254" fill="#4ade80">              3. lab-debate: is linear probing the right test?</text>
    <text x="28" y="298" fill="#7dd3fc">&gt; write a script for E1</text>
    <text x="28" y="330" fill="#e2e8f0">Plan: load activations → fit probe → report accuracy per layer.</text>
    <text x="28" y="356" fill="#94a3b8">  seed = 0</text>
    <text x="28" y="380" fill="#94a3b8">  <tspan fill="#c4b5fd"># ASSUME A2: features are linearly decodable</tspan></text>
    <text x="28" y="404" fill="#94a3b8">  assert acts.shape[0] == labels.shape[0]</text>
    <text x="28" y="436" fill="#4ade80">✓ added A2 to lab/assumptions.md · skipped: multi-GPU, resume logic</text>
